[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qilin-recommender"
version = "0.1.0"
description = "Exploratory analysis and baseline recommendation modeling for the THUIR/Qilin Xiaohongshu dataset."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets==4.5.0",
  "joblib==1.5.2",
  "matplotlib==3.9.4",
  "numpy==2.0.2",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

