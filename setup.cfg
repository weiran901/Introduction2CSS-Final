[metadata]
name = qilin-recommender
version = 0.1.0
description = Exploratory analysis and baseline recommendation modeling for the THUIR/Qilin Xiaohongshu dataset.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
install_requires =
    datasets==4.5.0
    joblib==1.5.2
    matplotlib==3.9.4
    numpy==2.0.2
    pandas==2.3.3
    pyarrow==21.0.0
    scikit-learn==1.6.1

[options.packages.find]
where = src

